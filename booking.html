<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>Book Appointment | Style Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css?family=Lobster|Roboto:400,700" rel="stylesheet" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/bootstrap.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>

<body class="bg-light">
  <!-- TOPMENU -->
  <div class="topmenu">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-7 col-sm-12 phone">
          <div>
            <i class="fa fa-phone"></i> <strong>Call:</strong> <a href="tel:+15552345678" style="color: inherit; text-decoration: none;">+1 (555) 234-5678</a>
            <span class="mx-2 text-muted">|</span>
            <i class="fa fa-whatsapp"></i> <strong>Alt:</strong> <a href="tel:+15559876543" style="color: inherit; text-decoration: none;">+1 (555) 987-6543</a>
          </div>
        </div>
        <div class="col-md-5 col-sm-12 address">
          <div>
            <i class="fa fa-envelope"></i> <a href="mailto:info@stylestudio.com" style="color: inherit; text-decoration: none;">info@stylestudio.com</a>
            <span class="mx-2 text-muted">|</span>
            <i class="fa fa-map-marker"></i> The Junction Mall, Nairobi
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="img/logo.png" style="max-height: 44px;" alt="Style Studio" class="img-fluid mr-2" />
        <span style="font-family: 'Lobster', cursive; font-size: 26px; color: #333;">Style Studio</span>
      </a>
      <div class="ml-auto">
        <a href="index.html" class="btn btn-outline-dark btn-sm">
          <i class="fa fa-arrow-left mr-1"></i> Back to Home
        </a>
      </div>
    </div>
  </nav>

  <!-- BOOKING SECTION -->
  <div class="site-section py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <h2 class="site-section-heading font-weight-bold mb-2">Book Your Appointment</h2>
                <p class="text-muted">Schedule your session at Style Studio. We look forward to giving you the best experience!</p>
                <div style="width: 50px; height: 3px; background: #f59f7e; margin: 10px auto;"></div>
              </div>

              <form action="#" method="post">
                <div class="row form-group">
                  <div class="col-md-6 mb-3 mb-md-0">
                    <label class="text-dark font-weight-bold" for="fname">First Name</label>
                    <input type="text" id="fname" class="form-control" placeholder="First Name" required />
                  </div>
                  <div class="col-md-6">
                    <label class="text-dark font-weight-bold" for="lname">Last Name</label>
                    <input type="text" id="lname" class="form-control" placeholder="Last Name" required />
                  </div>
                </div>

                <div class="row form-group">
                  <div class="col-md-6 mb-3 mb-md-0">
                    <label class="text-dark font-weight-bold" for="date">Preferred Date</label>
                    <input type="date" id="date" class="form-control px-2" required />
                  </div>
                  <div class="col-md-6">
                    <label class="text-dark font-weight-bold" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Email" required />
                  </div>
                </div>

                <div class="row form-group">
                  <div class="col-md-12">
                    <label class="text-dark font-weight-bold" for="treatment">Service Desired</label>
                    <select name="treatment" id="treatment" class="form-control">
                      <option value="Hair Cut">Hair Cut</option>
                      <option value="Trimming">Trimming</option>
                      <option value="Hair Coloring">Hair Coloring</option>
                      <option value="Dreadlocks">Dreadlocks</option>
                      <option value="Shave">Shave</option>
                      <option value="Hair Conditioning">Hair Conditioning</option>
                      <option value="Texturizing">Texturizing</option>
                      <option value="Nail Services">Nail Services</option>
                    </select>
                  </div>
                </div>

                <div class="row form-group">
                  <div class="col-md-12">
                    <label class="text-dark font-weight-bold" for="note">Notes &amp; Special Requests</label>
                    <textarea name="note" id="note" cols="30" rows="4" class="form-control"
                      placeholder="Write any preferences, stylist request, or notes here..."></textarea>
                  </div>
                </div>

                <div class="row form-group mb-0">
                  <div class="col-md-12 text-center">
                    <input type="submit" value="Confirm Appointment" class="btn btn-general btn-greenish py-2 px-5 text-uppercase font-weight-bold"
                      style="color: black; border-color: black;" />
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer bg-dark text-white py-4 mt-5 text-center">
    <div class="container">
      <p class="mb-0 text-muted">Copyright &copy; 2026 <strong>Style Studio</strong>. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
</body>

</html>
